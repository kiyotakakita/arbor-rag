[project]
name = "decision-rag-boilerplate"
version = "0.1.0"
description = "Reusable hierarchical search and recommendation engine based on DecisionRAG architecture (hierarchical tree pruning, single forward-pass batch decision model, dense hybrid rescue, and listwise reranking)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "DecisionRAG Team" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dense = [
    "sentence-transformers>=2.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
